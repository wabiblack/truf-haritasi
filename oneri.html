<script>
// Puanlama kaynağı: /workspace/truf/olusum-kosullari.md (Denetçi, 10 Kas 2026). Köşeli parantez = kaynak etiketi.
const VER='20261110c';const U=u=>u+(u.includes('?')?'&':'?')+'v='+VER;
const BUGUN=new Date(); // telefonun tarihi
const AYAD=['','Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const KAYIT_AEST=['Antalya','Artvin','Aydın','Bolu','Burdur','Denizli','Düzce','Hatay','İstanbul','İzmir','Kırklareli','Konya','Muğla','Ordu','Osmaniye'];
const IKLIM_S={yag:[400,1500],sic:[6.8,11.5],k:'[S]'};
const TUR={
 uncinatum:{ad:'Burgonya trüfü',lat:'T. uncinatum',not:'aestivum ile aynı tür, sonbahar-kış hasadı [S]',sezon:[8,1,12,31],sezonK:'Ağustos–Aralık [Ü]; Ocak\'a uzayabilir [5]',
   ph:{tam:[7.01,14],yarim:[6.6,7],k:'pH 7 üstü, 6,6–7 sınırda [S][5]'},kirec:'ister',iklim:IKLIM_S,agac:{tip:'agirlikli',k:'meşe, fındık, kayın; ladin de konak [S]'},il:KAYIT_AEST,ilK:'aestivum adıyla kayıtlı [1]'},
 aestivum:{ad:'Yazlık siyah trüf',lat:'T. aestivum',sezon:[6,1,8,31],sezonK:'Haziran–Ağustos [Ü]',
   ph:{tam:[7.01,14],yarim:[6.6,7],k:'pH 7 üstü, 6,6–7 sınırda [S][5]'},kirec:'ister',iklim:IKLIM_S,agac:{tip:'agirlikli',k:'meşe, fındık, kayın; ladin de konak [S]'},il:KAYIT_AEST,ilK:'[1]'},
 brumale:{ad:'Kışlık siyah trüf',lat:'T. brumale',sezon:[11,1,1,30],sezonK:'1 Kasım–30 Ocak [5]',
   ph:{tam:[6.5,7.5],yarim:[6,6.499],k:'en uygun pH 6,5 [iForest 2018]; 6,5–7,5 uyuyor, 6–6,5 sınırda'},kirec:'az',nemli:true,kilNot:'Derin, biraz killi, ıslaklığa dayanıklı toprak sever (ticari kaynak, fidanlık sitesi); puana katılmadı',agac:{tip:'genis',k:'ıhlamur, meşe [FEMS], kestane [UPM]'},il:['Denizli','Niğde','Osmaniye','Samsun'],ilK:'[1]'},
 borchii:{ad:'Bianchetto',lat:'T. borchii',sezon:[1,15,4,30],sezonK:'15 Ocak–30 Nisan [Ü]',
   ph:{tam:[7,8],yarim:[6,7],k:'çoğunlukla 7–8, hafif asidik 6–7 de olur [Z]'},kirec:'ister',iklimY:{yag:[600,1600],k:'[Ü]'},agac:{tip:'her',k:'meşe, fındık, kavak, ıhlamur, kestane, çam, sedir [Z]'},il:['Aydın','Denizli','Kahramanmaraş','Muğla','Samsun','Tekirdağ'],ilK:'[1]'},
 magnatum:{ad:'Beyaz trüf',lat:'T. magnatum',sezon:[7,15,12,15],sezonK:'15 Temmuz–15 Aralık, Romanya [5]',kayitYok:true,
   ph:{tam:[7.8,8.4],yarim:null,k:'İtalya\'da pH 7,8–8,4 [5]'},kirec:'ister',agac:{tip:'genis',k:'meşe ve karışık meşcere [5]'}},
 melanosporum:{ad:'Périgord trüfü',lat:'T. melanosporum',sezon:[12,1,3,31],sezonK:'Aralık–Mart [Ü]',kayitYok:true,
   ph:{tam:[7.01,14],yarim:null,k:'alkalin, İtalya ort. pH 7,9 [5]'},kirec:'ister',iklimY:{yag:[485,1500],k:'[TR][UZ]'},rakim:[600,1200]},
 terfezia:{ad:'Keme (çöl trüfü)',lat:'Terfezia boudieri',sezon:[3,1,5,31],sezonK:'Mart–Mayıs [AK]',
   ph:{tam:[7.01,14],yarim:[6.6,7],k:'bazik; Elazığ ölçümü pH 7,12 [AK]'},kirec:'ister',kurak:true,il:['Batman','Denizli','Diyarbakır','Elazığ','Gaziantep','Karaman','Malatya','Niğde','Şanlıurfa','Adana','Aksaray','Konya','Yozgat'],ilK:'[2]',
   konakNot:'Konak ağaç değil, Helianthemum (otsu bitki) [AK]; bu bitkinin haritası yok, puanlanmadı'}
};
const SIRA=['uncinatum','brumale','aestivum','borchii','magnatum','melanosporum','terfezia'];
function gunFark(a,b){return Math.round((b-a)/864e5);}
function sezonBilgi(t){
  if(!t.sezon)return{dur:'sezon-bilgisi-yok'};
  const[am,ad,bm,bd]=t.sezon,y=BUGUN.getFullYear(),bugun=new Date(y,BUGUN.getMonth(),BUGUN.getDate());
  for(const yy of [y-1,y,y+1]){const bas=new Date(yy,am-1,ad);let son=new Date(yy,bm-1,bd);if(son<bas)son=new Date(yy+1,bm-1,bd);
    if(bugun>=bas&&bugun<=son){const k=gunFark(bugun,son);return{dur:k<=14?'sezon-bitiyor':'sezonda',kalan:k,gecen:gunFark(bas,bugun),top:gunFark(bas,son)};}}
  let enYakin=1e9;for(const yy of [y,y+1]){const bas=new Date(yy,am-1,ad);const f=gunFark(bugun,bas);if(f>0&&f<enYakin)enYakin=f;}
  return{dur:enYakin<=30?'sezon-basliyor':'sezon-disi',baslamaya:enYakin};
}
const sezonda=t=>['sezonda','sezon-bitiyor'].includes(sezonBilgi(t).dur);
let RZ={};
function rozet(k){const r=RZ[k];return r?'<span class="rz" style="background:'+r.zemin+';color:'+r.yazi+'">'+r.metin+'</span>':'';}
function puanla(p,k){
  const t=TUR[k],n=[];let s=0,max=0;
  const ekle=(ik,m,kay)=>n.push([ik,m,kay||'']);
  if(t.ph){max+=3;
    if(p.ph==null) ekle('⚪','Toprak verisi alınamadı','SoilGrids');
    else if(p.ph>=t.ph.tam[0]&&p.ph<=t.ph.tam[1]){s+=3;ekle('🟢','Toprak pH '+p.ph+' · türün isteği: '+t.ph.k,'SoilGrids 5–15 cm; model tahmini, arazide ölçülmeli')}
    else if(t.ph.yarim&&p.ph>=t.ph.yarim[0]&&p.ph<=t.ph.yarim[1]){s+=1.5;ekle('🟡','Toprak pH '+p.ph+', sınırda · türün isteği: '+t.ph.k,'SoilGrids 5–15 cm; model tahmini, arazide ölçülmeli')}
    else ekle('🔴','Toprak pH '+p.ph+': uymuyor · türün isteği: '+t.ph.k,'SoilGrids 5–15 cm; model tahmini, arazide ölçülmeli');}
  if(t.kirec==='ister'){max+=1;
    if(p.kirec==null) ekle('⚪','Toplam kireç: veri yok','FAO HWSD v2');
    else if(p.kirec>0){s+=1;ekle('🟢','Toplam kireç %'+p.kirec+': kireçli toprak, tür kireçli toprak ister','FAO HWSD v2, ~1 km, aktif kireç değil')}
    else{s+=0.5;ekle('🟡','Toplam kireç %0: sınırda; aestivum Polonya\'da %0,3 kireçte de bulunmuş [5]','FAO HWSD v2, ~1 km, aktif kireç değil')}}
  else if(t.kirec==='az'&&p.kirec!=null) ekle('ℹ️','Toplam kireç %'+p.kirec+'; tür az kireçli toprakta da olur [UPM], puana katılmadı','FAO HWSD v2');
  const yag=t.iklim?t.iklim.yag:(t.iklimY?t.iklimY.yag:null),yk=t.iklim?t.iklim.k:(t.iklimY?t.iklimY.k:'');
  if(yag){max+=1;
    if(p.wc_yag>=yag[0]&&p.wc_yag<=yag[1]){s+=1;ekle('🟢','Uzun yıl ort. yağış '+p.wc_yag+' mm/yıl · istek yıllık '+yag[0]+'–'+yag[1]+' mm '+yk,'WorldClim 2.1, 1970–2000')}
    else ekle('🔴','Uzun yıl ort. yağış '+p.wc_yag+' mm/yıl · istek yıllık '+yag[0]+'–'+yag[1]+' mm '+yk,'WorldClim 2.1, 1970–2000');}
  if(t.iklim){max+=1;const c=t.iklim.sic;
    if(p.wc_sic>=c[0]&&p.wc_sic<=c[1]){s+=1;ekle('🟢','Uzun yıl ort. sıcaklık '+p.wc_sic+' °C · istek '+c[0]+'–'+c[1]+' °C [S]','WorldClim 2.1, 1970–2000')}
    else ekle('🔴','Uzun yıl ort. sıcaklık '+p.wc_sic+' °C · istek '+c[0]+'–'+c[1]+' °C [S]','WorldClim 2.1, 1970–2000');}
  if(t.rakim){max+=1;
    if(p.rakim>=t.rakim[0]&&p.rakim<=t.rakim[1]){s+=1;ekle('🟢','Rakım '+p.rakim+' m · İspanya\'da çoğu 600–1200 m [TR]','Open-Meteo')}
    else ekle('🔴','Rakım '+p.rakim+' m · İspanya\'da çoğu 600–1200 m [TR]','Open-Meteo');}
  if(t.kurak){max+=1;
    if(p.ai==null) ekle('⚪','Kuraklık indeksi: veri yok','');
    else if(p.ai<0.5){s+=1;ekle('🟢','Kuraklık indeksi '+p.ai+': yarı kurak veya daha kurak (UNEP, 0,5 altı) · tür kurak-yarı kurak bölgede yaşar [AK]','Kuraklık indeksi: WorldClim 2.1 yağışı / Hargreaves buharlaşması, 1970–2000; sınıflar UNEP')}
    else if(p.ai<0.65){s+=0.5;ekle('🟡','Kuraklık indeksi '+p.ai+': kuru yarı nemli, sınırda (UNEP 0,5–0,65)','Kuraklık indeksi: WorldClim 2.1 yağışı / Hargreaves buharlaşması, 1970–2000; sınıflar UNEP')}
    else ekle('🔴','Kuraklık indeksi '+p.ai+': nemli, uymuyor (UNEP 0,65 ve üstü)','Kuraklık indeksi: WorldClim 2.1 yağışı / Hargreaves buharlaşması, 1970–2000; sınıflar UNEP');
    if(p.ekim_mart!=null) ekle('ℹ️','Ekim–Mart uzun yıl yağışı '+p.ekim_mart+' mm; kaynaklar bu dönemin düzenli yağışını belirleyici sayıyor, eşik yok','WorldClim 2.1');}
  if(t.nemli){max+=1;
    if(p.ai==null) ekle('⚪','Kuraklık indeksi: veri yok','');
    else if(p.ai>=0.65){s+=1;ekle('🟢','Kuraklık indeksi '+p.ai+': nemli (UNEP 0,65 ve üstü) · brumale diğer trüflerden nemli toprağı sever [İtalya derlemesi]','Kuraklık indeksi: WorldClim 2.1 yağışı / Hargreaves buharlaşması, 1970–2000; sınıflar UNEP')}
    else if(p.ai>=0.5){s+=0.5;ekle('🟡','Kuraklık indeksi '+p.ai+': kuru yarı nemli, sınırda · brumale nemli toprağı sever','Kuraklık indeksi: WorldClim 2.1 yağışı / Hargreaves buharlaşması, 1970–2000; sınıflar UNEP')}
    else ekle('🔴','Kuraklık indeksi '+p.ai+': yarı kurak, uymuyor · brumale nemli toprağı sever','Kuraklık indeksi: WorldClim 2.1 yağışı / Hargreaves buharlaşması, 1970–2000; sınıflar UNEP');}
  if(t.kilNot) ekle('ℹ️',t.kilNot,'ticari kaynak');
  if(t.agac){max+=2;
    const g=p.genis,i=p.igne,v=t.agac.tip==='her'?(g+i):t.agac.tip==='agirlikli'?Math.round(g+i/2):g,ad=t.agac.tip==='her'?'orman':t.agac.tip==='agirlikli'?'orman (geniş yapraklı tam, iğne yapraklı yarım sayıldı)':'geniş yapraklı orman';
    if(g==null) ekle('⚪','Orman tipi verisi alınamadı','Copernicus');
    else if(v>=30){s+=2;ekle('🟢','Çevrenin yüzde '+v+' kadarı '+ad+' · konaklar: '+t.agac.k,'Copernicus Orman Tipi 2018, 2,5×2,5 km; %30 ve %10 eşikleri ekip varsayımı')}
    else if(v>=10){s+=1;ekle('🟡','Çevrenin yüzde '+v+' kadarı '+ad+', az · konaklar: '+t.agac.k,'Copernicus Orman Tipi 2018; %30 ve %10 eşikleri ekip varsayımı')}
    else ekle('🔴','Çevrede '+ad+' çok az (yüzde '+v+') · konaklar: '+t.agac.k,'Copernicus Orman Tipi 2018; %30 ve %10 eşikleri ekip varsayımı');}
  else if(t.konakNot) ekle('⚪',t.konakNot,'');
  else ekle('⚪','Konak ağaç: akademik kaynak yok, puanlanmadı','');
  if(t.il){max+=1;
    if(t.il.includes(p.il)){s+=1;ekle('🟢',p.il+' ilinde kayıt var '+t.ilK,'Türkiye trüf listesi')}
    else ekle('🟡',p.il+': bu bölgede kayıt yok, uygunluk tahmini '+t.ilK,'Türkiye trüf listesi');}
  else if(t.kayitYok) ekle('⚠️','Türkiye\'de doğal kaydı yok','[2]');
  const sb=sezonBilgi(t);ekle(sezonda(t)?'🟢':'🔴',AYAD[BUGUN.getMonth()+1]+': '+(RZ[sb.dur]?RZ[sb.dur].metin.toLowerCase():'')+' ('+t.sezonK+')','');
  if(p.yagis90!=null) ekle('ℹ️','Bu yıl: son 90 gün '+p.yagis90+' mm yağış (son 30 gün '+p.yagis30+' mm), nem %'+p.nem+'; puana katılmadı','Open-Meteo');
  if(!t.rakim) ekle('ℹ️','Rakım '+p.rakim+' m; bu tür için eşik yok','Open-Meteo');
  if(p.kil!=null) ekle('ℹ️','Kil %'+p.kil+', kum %'+p.kum+', organik karbon '+p.oc+' g/kg; eşik yok','SoilGrids');
  if(p.jips!=null) ekle('ℹ️','Jips (kükürtlü mineral) %'+p.jips+'; eşik yok','FAO HWSD v2');
  ekle('ℹ️','Yağış ve sıcaklık puanı uzun yıl ortalamasından','WorldClim 2.1, 1970–2000, ~4,5 km');
  if(p.ai!=null&&!t.kurak&&!t.nemli) ekle('ℹ️','Kuraklık indeksi '+p.ai+'; bu tür için puana katılmadı','Kuraklık indeksi: WorldClim 2.1 yağışı / Hargreaves buharlaşması, 1970–2000; sınıflar UNEP');
  return{s:Math.round(s*10)/10,max,n};
}
const map=L.map('map',{zoomSnap:0.25});
L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',{maxZoom:17,attribution:'© OpenTopoMap, © OSM'}).addTo(map);
let D,secili='simdi',isaret=[];
function sirala(k){return D.noktalar.map(p=>({p,r:puanla(p,k)})).sort((a,b)=>b.r.s/b.r.max-a.r.s/a.r.max||(b.p.genis||0)-(a.p.genis||0));}
function secici(){const d=document.getElementById('secici');
  d.innerHTML='<button data-k="simdi" class="'+(secili==='simdi'?'on':'')+'">🍄 Şu an sezonda</button>'+SIRA.map(k=>{const t=TUR[k],sb=sezonBilgi(t),sol=!sezonda(t)||t.kayitYok;
    return '<button data-k="'+k+'" class="'+(secili===k?'on ':'')+(sol&&secili!==k?'soluk':'')+'"><img src="'+U('fikon/'+k+'.png')+'" alt="">'+t.ad+'</button>';}).join('');
  d.querySelectorAll('button').forEach(b=>b.onclick=()=>{secili=b.dataset.k;ciz();});}
function turKart(k,ust){const t=TUR[k],sb=sezonBilgi(t),L3=sirala(k).slice(0,3);
  const ser=sb.top?'<div style="height:6px;background:#eee;border-radius:3px;margin-top:6px"><div style="height:6px;width:'+Math.round(100*sb.gecen/sb.top)+'%;background:#C9A24A;border-radius:3px"></div></div>':'';
  const alt=sb.kalan!=null?'Sezonun bitmesine '+sb.kalan+' gün':(sb.baslamaya?'Sezonun başlamasına '+sb.baslamaya+' gün':'');
  return '<div class="kart'+((!sezonda(t)||t.kayitYok)&&ust?' soluk':'')+'"><div class="bas"><img src="'+U('foto/'+k+'_kare.jpg')+'" alt="" style="border-color:'+(RENK[k]||'#6b4a2b')+'"><div><b>'+t.ad+'</b> <i class="alt">'+t.lat+'</i><br>'+rozet(sb.dur)+(t.kayitYok?rozet('tr-kayit-yok'):'')+'<div class="alt">'+alt+' · '+t.sezonK+'</div>'+(t.not?'<div class="alt">'+t.not+'</div>':'')+'</div></div>'+ser+
   '<ul>'+L3.map((x,i)=>'<li><a href="#" onclick="secili=\''+k+'\';ciz();return false">'+tIk(k)+(i+1)+'. '+(x.p.ilce?x.p.ilce+', ':'')+x.p.il+' <span class="k">('+x.p.lat.toFixed(2)+', '+x.p.lon.toFixed(2)+')</span> · '+x.r.s+'/'+x.r.max+'</a></li>').join('')+'</ul></div>';}
let RENK={};
let ETK={tek:{},ortak:[]},LJ=null;
function tIk(k){return '<img class="tr" src="'+U('fikon/'+k+'.png')+'" style="border:2px solid '+(RENK[k]||'#6b4a2b')+'" alt="">';}
function ikTek(k){const e=ETK.tek[k];if(!e)return L.icon({iconUrl:U('fikon/'+k+'.png'),iconSize:[32,32],className:'yuv'});return L.icon({iconUrl:U(e.dosya),iconSize:[e.boyut[0]/2,e.boyut[1]/2],iconAnchor:[e.anchor[0]/2,e.anchor[1]/2],popupAnchor:[0,-e.anchor[1]/2+6]});}
function ikIki(a,c){const e=ETK.ortak.find(o=>o.ad===a+'+'+c)||ETK.ortak.find(o=>o.ad===c+'+'+a);if(!e)return ikTek(a);return L.icon({iconUrl:U(e.dosya),iconSize:[e.boyut[0]/2,e.boyut[1]/2],iconAnchor:[e.anchor[0]/2,e.anchor[1]/2],popupAnchor:[0,-e.anchor[1]/2+6]});}
function lejant(ks){if(LJ)LJ.remove();LJ=L.control({position:'bottomright'});LJ.onAdd=()=>{const d=L.DomUtil.create('div','lej');d.innerHTML=ks.map(k=>'<div><i style="background:'+(RENK[k]||'#6b4a2b')+'"></i>'+(ETK.tek[k]?ETK.tek[k].etiket:k)+' · '+TUR[k].ad+'</div>').join('');return d;};LJ.addTo(map);}

function ciz(){secici();isaret.forEach(m=>m.remove());isaret=[];const liste=document.getElementById('liste'),sim=document.getElementById('simdi'),not=document.getElementById('not');liste.innerHTML='';const b=[];
  const ortak='Puan sadece kaynağı olan ölçütlerden; her satırın kaynağı yanında. Eşikler oluşum koşulları tablosundan, kullanıcı onayı bekliyor. Türkiye geneli '+D.noktalar.length+' nokta, yaklaşık 20 km aralıklı. Veri tarihi '+D.tarih+'. Tahmindir, saha kontrolü gerekir.';
  if(secili==='simdi'){
    const ana=SIRA.filter(k=>sezonda(TUR[k])&&!TUR[k].kayitYok),diger=SIRA.filter(k=>!ana.includes(k));
    sim.innerHTML='<h3>Şu an toplanabilir · '+AYAD[BUGUN.getMonth()+1]+'</h3>'+ana.map(k=>turKart(k,true)).join('')+'<h3 style="font-size:14px;color:#7a7364">Diğer türler</h3>'+diger.map(k=>turKart(k,true)).join('');
    not.innerHTML='Haritada şu an sezonda olan türlerin en iyi 5 noktası var. '+ortak;
    const G={};ana.forEach(k=>sirala(k).slice(0,5).forEach(x=>{const id=x.p.lat+','+x.p.lon;(G[id]=G[id]||{p:x.p,t:[]}).t.push([k,x.r]);}));
    Object.values(G).forEach(g=>{const p=g.p;b.push([p.lat,p.lon]);const yer=(p.ilce?p.ilce+', ':'')+p.il;
      const bol=g.t.map(([k,r])=>'<div style="border-left:4px solid '+(RENK[k]||'#6b4a2b')+';padding-left:6px;margin-top:6px"><b>'+tIk(k)+TUR[k].ad+' · '+r.s+'/'+r.max+'</b><ul>'+r.n.filter(z=>z[0]!=='ℹ️').map(z=>'<li><span class="i">'+z[0]+'</span>'+z[1]+'</li>').join('')+'</ul><a href="#" onclick="secili=\''+k+'\';ciz();return false">Bu türün tüm önerileri</a></div>').join('');
      isaret.push(L.marker([p.lat,p.lon],{icon:g.t.length>1?ikIki(g.t[0][0],g.t[1][0]):ikTek(g.t[0][0])}).addTo(map).bindPopup('<b>'+yer+'</b>'+(g.t.length>1?'<div style="color:#3D5A40;font-weight:700">İki tür de uygun</div>':'')+bol));});
    lejant(ana);
  } else {
    const k=secili,t=TUR[k];sim.innerHTML=turKart(k,false);
    not.innerHTML='<b>'+t.ad+'</b> için öneriler. '+(!sezonda(t)?'Bu tür şu an sezon dışı. ':'')+(t.kayitYok?'Türkiye\'de doğal kaydı yok. ':'')+ortak;
    sirala(k).slice(0,8).forEach((x,i)=>{const p=x.p,r=x.r,id='k'+i;b.push([p.lat,p.lon]);
      isaret.push(L.marker([p.lat,p.lon],{opacity:sezonda(t)&&!t.kayitYok?1:0.55,icon:ikTek(k)}).addTo(map).bindTooltip(String(i+1),{permanent:true,direction:'right',offset:[14,-20]}).on('click',()=>document.getElementById(id).scrollIntoView({behavior:'smooth'})));
      const el=document.createElement('div');el.className='kart';el.id=id;
      el.innerHTML='<div class="bas"><div><b>'+tIk(k)+TUR[k].ad+' · '+(i+1)+'. '+(p.ilce?p.ilce+', ':'')+p.il+'</b><div class="alt">'+p.lat.toFixed(3)+', '+p.lon.toFixed(3)+' · '+p.rakim+' m</div></div><div class="puan">'+r.s+'/'+r.max+'</div></div><ul>'+r.n.map(z=>'<li><span class="i">'+z[0]+'</span>'+z[1]+(z[2]?' <span class="k">('+z[2]+')</span>':'')+'</li>').join('')+'</ul><a href="./?lat='+p.lat+'&lon='+p.lon+'"><button>Haritada aç</button></a>';
      liste.appendChild(el);});
  }
  if(secili!=='simdi')lejant([secili]);
  if(b.length)map.fitBounds(b,{padding:[30,30]});
}
const F=u=>fetch(U(u),{cache:'no-store'}).then(r=>r.json());
Promise.all([F('oneri.json'),F('rozetler.json'),F('harita-renkleri.json'),F('etiketli-isaretciler.json')]).then(([d,rz,hr,et])=>{D=d;RZ=rz;ETK.tek=et.tek;ETK.ortak=Object.entries(et.ortak||{}).map(([ad,o])=>Object.assign({ad},o));for(const k in hr)RENK[k]=hr[k]&&hr[k].bolge_dolgu;ciz();});
</script></body></html>
